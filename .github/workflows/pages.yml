# Deploy ต้นแบบ (Next.js static export) ขึ้น GitHub Pages ทุก push บน main
# เปิดดูบนมือถือได้ที่ https://dear-pyn.github.io/vms-plus-workspace/
# ข้อมูลในต้นแบบเป็นข้อมูลจำลองทั้งหมด — tools/capture/captures/ (ข้อมูลจริง) อยู่ใน .gitignore ไม่ขึ้นที่นี่
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # basePath = ชื่อ repo เพราะ Pages เสิร์ฟที่ /<repo>/
      - name: build (validate + next build + .nojekyll)
        run: NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }} npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
