# Deploy ต้นแบบ (Next.js static export) ขึ้น GitHub Pages ทุก push บน main
# เปิดดูบนมือถือได้ที่ https://dear-pyn.github.io/vms-plus-workspace/prototypes/overhaul/
# วิธี: build แล้ววางไฟล์ลง branch gh-pages (Settings → Pages → Deploy from a branch → gh-pages / root)
# ข้อมูลในต้นแบบเป็นข้อมูลจำลองทั้งหมด — tools/capture/captures/ (ข้อมูลจริง) อยู่ใน .gitignore ไม่ขึ้นที่นี่
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # basePath = ชื่อ repo เพราะ Pages เสิร์ฟที่ /<repo>/ · build ใส่ out/.nojekyll ให้แล้ว (ไม่ผ่าน Jekyll)
      - name: build (validate + next build + .nojekyll)
        # ฐานข้อมูลกลางของต้นแบบ (Supabase · ข้อมูลจำลองเท่านั้น) — publishable key ออกแบบให้อยู่ในหน้าเว็บได้ สิทธิ์คุมด้วย RLS ของตาราง prototype_snapshot
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://hgattobrdvjzapsbaxkc.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0O2NK19Y4SAOwc3RIvF_8w_v5hJxUlY
        run: NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }} npm run build

      - name: วางไฟล์ลง branch gh-pages
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
