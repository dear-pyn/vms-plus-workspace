<!doctype html><html lang="th"><meta charset="utf-8"><style>body{font:14px system-ui;margin:20px;color:#30233f}textarea{box-sizing:border-box;width:100%;height:320px;margin:12px 0;font:12px monospace}button{padding:10px 20px;background:#64278b;color:white;border:0;border-radius:6px}pre{white-space:pre-wrap}</style><h2>VMS+ · Screen spec → Figma</h2><p>วาง JSON ของเคสและ revision ที่ต้องการ สร้างเพิ่มในหน้าปัจจุบัน</p><textarea id="input" aria-label="JSON ของเคส" placeholder="วาง JSON ที่นี่"></textarea><button id="build">สร้างจาก JSON</button><pre id="result" role="status"></pre><script>const button=document.getElementById('build');button.onclick=()=>{button.disabled=true;document.getElementById('result').textContent='กำลังสร้าง…';parent.postMessage({pluginMessage:{type:'build',json:document.getElementById('input').value}},'*')};onmessage=event=>{const msg=event.data.pluginMessage;if(!msg)return;button.disabled=false;document.getElementById('result').textContent=(msg.ok?'สำเร็จ: ':'ไม่สำเร็จ: ')+msg.message};</script></html>
